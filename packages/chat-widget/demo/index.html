<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mkEngage Widget Demo — hostile host page</title>
    <!-- Deliberately aggressive host styles: the widget must be immune (§4 Shadow DOM). -->
    <style>
      * { font-family: "Comic Sans MS", cursive !important; }
      button { background: red !important; border: 5px dashed lime !important; }
      ul { list-style: square !important; padding: 40px !important; }
      body { background: #fdf6e3; margin: 0; padding: 40px; }
      .content { max-width: 640px; margin: 0 auto; }
    </style>
  </head>
  <body>
    <div class="content">
      <h1>Demo host page</h1>
      <p>
        This page has intentionally hostile global CSS (Comic Sans everywhere, red buttons,
        square list bullets). The chat widget in the corner must be visually unaffected —
        that is the Shadow DOM isolation requirement of directive §4.
      </p>
    </div>

    <script type="module">
      import { mount } from "../src/index.ts";

      // In a real integration the host backend renders external_id + signature
      // into the page (HMAC computed server-side, ADR-009). The demo takes
      // them from the URL so any backend-generated signature can be tested.
      const params = new URLSearchParams(location.search);
      const externalId = params.get("external_id");
      const signature = params.get("sig");

      const dark = params.get("theme") === "dark";

      mount({
        siteKey: params.get("site_key") ?? "sk_demo",
        apiUrl: "http://127.0.0.1:8000",
        title: dark ? "TechPIO" : "Acme Support",
        subtitle: dark ? "We are online!" : "Typically replies in a few minutes",
        theme: dark ? "dark" : undefined,
        inputPlaceholder: dark ? "We are here to help you" : undefined,
        greeting: dark
          ? "Hi, there! Welcome Back to TechPIO Services.\nIt's great to see you again. How can we help you today?"
          : "Hi there! 👋 Welcome to Acme. How can we help you today?",
        quickReplies: dark
          ? ["Interested in Services!", "Book a Free Discovery Call", "Just exploring"]
          : ["Track my order", "Shipping info", "Returns", "Talk to a human"],
        ...(externalId !== null && signature !== null
          ? {
              identity: {
                externalId,
                signature,
                name: params.get("name") ?? undefined,
                email: params.get("email") ?? undefined,
              },
            }
          : {}),
      });
    </script>
  </body>
</html>
